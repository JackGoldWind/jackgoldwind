<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jack Gold Wind</title>
<link rel="icon" id="favicon" href="data:," />
<link rel="stylesheet" href="style.css" />
<meta name="description" content="Streamer/Gamer Nocturno" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://jackgoldwind.github.io/jackgoldwind/" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://jackgoldwind.github.io/jackgoldwind/" />
<meta property="og:title" content="Jack Gold Wind" />
<meta property="og:description" content="Streamer/Gamer Nocturno" />
<meta property="og:image" content="https://i.imgur.com/petAVsa.png" />
<meta name="twitter:card" content="summary" />
</head>
<body>
  <div id="bg-layer"></div>
  <header class="hero">
    <img id="avatar" class="avatar" alt="" hidden />
    <h1 id="name"></h1>
    <p id="bio" class="bio"></p>
    <nav id="links" class="links"></nav>
    <div id="contact" class="contact"></div>
  </header>

  <div class="page-grid">
  <main>
    <section id="calendar">
      <h2>📅 Calendario de eventos</h2>
      <div id="events" class="events"></div>
    </section>

    <section id="playing" hidden>
      <div class="section-head">
        <h2>🕹️ Jugando ahora</h2>
        <div class="car-nav"><button class="btn car-btn" data-dir="-1" aria-label="Anterior">‹</button><button class="btn car-btn" data-dir="1" aria-label="Siguiente">›</button></div>
      </div>
      <div id="playing-track" class="carousel"></div>
    </section>

    <section id="recent" hidden>
      <div class="section-head"><h2>🕒 Jugado recientemente</h2></div>
      <div id="recent-track" class="recent-track"></div>
    </section>

    <section id="games">
      <div class="section-head">
        <h2 id="games-title">🎮 Lista de juegos</h2>
        <div class="games-head-btns">
          <div id="gl-mode" class="gl-mode" role="tablist" hidden><button class="btn gl-btn active" data-gl="list" role="tab">🎮 Mi lista</button><button class="btn gl-btn" data-gl="most" role="tab">🏆 Más jugados</button></div>
          <button id="suggest-btn" class="btn btn-accent">💡 Sugerir un juego</button>
        </div>
      </div>
      <div id="most-list" class="most-list" hidden></div>
      <div id="list-wrap">
      <div class="toolbar">
        <input id="game-search" type="search" placeholder="Buscar juego…" />
        <select id="game-platform"><option value="">Todas las plataformas</option></select>
        <div class="sortbtns" role="group" aria-label="Orden">
          <button class="btn sort-btn active" data-sort="az">A-Z</button>
          <button class="btn sort-btn" data-sort="newest">Más recientes ↓</button>
          <button class="btn sort-btn" data-sort="oldest">Más antiguos ↑</button>
        </div>
      </div>
      <div id="counters" class="counters"></div>
      <div id="game-list" class="game-list"></div>
      <button id="more-games" class="btn" hidden>Mostrar más</button>
      </div>
    </section>
  </main>
  <aside id="sponsors" class="sponsors" hidden aria-label="Patrocinadores"></aside>
  </div>

  <footer class="footer"><span id="updated"></span></footer>

  <div id="suggest-modal" class="modal" hidden>
    <div class="modal-box">
      <button id="suggest-close" class="close" aria-label="Cerrar">✕</button>
      <h3>💡 Sugerir un juego</h3>
      <p class="muted">Se abrirá GitHub para enviar tu sugerencia (necesitas iniciar sesión ahí — así evitamos el spam). Máximo 5 sugerencias por día desde este navegador.</p>
      <label for="sg-name">Nombre del juego</label>
      <input id="sg-name" type="text" autocomplete="off" placeholder="Empieza a escribir…" />
      <div id="sg-results" class="sg-results"></div>
      <label for="sg-user">Tu usuario (opcional, sale junto al juego)</label>
      <div class="sg-who"><input id="sg-user" type="text" maxlength="40" autocomplete="off" placeholder="Tu nombre en el chat" /><select id="sg-plat" aria-label="Plataforma"><option value="twitch">Twitch</option><option value="youtube">YouTube</option><option value="kick">Kick</option><option value="tiktok">TikTok</option><option value="web">Otra</option></select></div>
      <p id="sg-cmd" class="muted" hidden></p>
      <label for="sg-note">Nota (opcional)</label>
      <textarea id="sg-note" rows="2" placeholder="¿Por qué crees que debería jugarlo?"></textarea>
      <p id="sg-msg" class="muted"></p>
      <button id="sg-send" class="btn btn-accent">Enviar sugerencia en GitHub</button>
    </div>
  </div>

  <script src="brands.js"></script>
  <script src="app.js"></script>
</body>
</html>
